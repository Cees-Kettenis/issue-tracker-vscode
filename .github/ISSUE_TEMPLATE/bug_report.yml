name: Bug report
description: Report a reproducible problem
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please provide enough detail to reproduce it.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
      placeholder: Briefly describe the bug
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List exact steps
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: input
    id: vscode_version
    attributes:
      label: VS Code version
      placeholder: e.g. 1.102.0

  - type: input
    id: extension_version
    attributes:
      label: Extension version
      placeholder: e.g. 1.2.0

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Windows 11 / macOS 14 / Ubuntu 24.04

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Add relevant output from the Local Issues output channel
